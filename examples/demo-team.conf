# 虚构示例层级：一个小型软件团队。
# 1 个总指挥，2 个组长，各带 3 个执行者。
#
# 格式：名称  上级（顶层写 -）  编号前缀（写 - 则自动生成）  角色说明

option rotate_bytes 262144
option keep 50

lead      -      L    总指挥：拆分任务、合并与发布
alpha     lead   A    前端组组长
alpha-1   alpha  A1   前端执行者：页面
alpha-2   alpha  A2   前端执行者：组件库
alpha-3   alpha  A3   前端执行者：端到端测试
beta      lead   B    后端组组长
beta-1    beta   B1   后端执行者：接口
beta-2    beta   B2   后端执行者：数据迁移
beta-3    beta   B3   后端执行者：性能测试
